version: 2

models:
  - name: transactions
    columns:
      - name: tx_id
        data_tests:
          - unique
          - not_null
      - name: split
        data_tests:
          - accepted_values:
              arguments:
                values: [train, test]
      - name: out_degree
        data_tests:
          - not_null
      - name: in_degree
        data_tests:
          - not_null
  - name: graph_edges
    columns:
      - name: tx_from
        data_tests:
          - not_null
      - name: tx_to
        data_tests:
          - not_null
      - name: split
        data_tests:
          - accepted_values:
              arguments:
                values: [train, test]
